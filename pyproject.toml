[project]
name = "asus-hackathon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opencv-python>=5.0.0.93",
    "pillow>=12",
    "rtmlib>=0.0.16",
]

[dependency-groups]
# YOLOv8（AGPL）只給舊版實驗 v1、v2 和 eval_syrip.py 的 YOLOv8 比較用，v3 不需要。
# 要用時執行：uv sync --group yolo（會多裝 PyTorch，約 2 GB）
yolo = [
    "ultralytics>=8.4.150",
]

[tool.uv]
# rtmlib 同時依賴 opencv-python 和 opencv-contrib-python，兩個都會裝成 cv2 而互相衝突；
# 我們只用核心功能，所以把 contrib 排除（marker 永遠不成立＝不安裝）。
override-dependencies = ["opencv-contrib-python; sys_platform == 'never'"]
